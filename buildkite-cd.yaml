agents:
  queue: private

steps:
  - label: build
    artifacts:
      - nixfmt-*
    command:
      - echo +++
      - nix build .#nixfmt-binaries
      - nix-store
        --query
        --include-outputs $(nix-store --query --deriver result)
        --requisites |
        grep -v '\.drv$$' |
        cachix push nixfmt
      - cp -L result/* .

  - label: coverage
    command:
      - echo +++ Fetch
      - git branch -D main
      - git branch main
      - git checkout main
      - echo --- Load environment
      - direnv allow
      - eval "$(direnv export bash)"
      - echo +++ Run tests
      - cd src/nixfmt
      - cargo tarpaulin --coveralls "$${COVERALLS_REPO_TOKEN}"
